name: Deploy Laravel Pro Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  schedule:
    # Run automatically every day at 00:00 UTC to pull the latest Laravel Docs
    - cron: '0 0 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # The full framework-history scan is expensive. On scheduled runs, compare
  # upstream HEAD SHAs against the last successful build and skip everything
  # when neither laravel/framework nor laravel/docs moved. Pushes and manual
  # dispatches always build.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      framework_sha: ${{ steps.remote.outputs.framework_sha }}
      docs_sha: ${{ steps.remote.outputs.docs_sha }}
    steps:
      - name: Resolve upstream HEAD SHAs
        id: remote
        run: |
          echo "framework_sha=$(git ls-remote https://github.com/laravel/framework.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "docs_sha=$(git ls-remote https://github.com/laravel/docs.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore last built SHAs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .pro-docs-last-shas
          # run_id key never hits; restore-keys falls back to the latest saved SHAs.
          key: pro-docs-shas-${{ github.run_id }}
          restore-keys: |
            pro-docs-shas-

      - name: Compare SHAs
        id: compare
        run: |
          CHANGED=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f .pro-docs-last-shas ]; then
            if grep -q "${{ steps.remote.outputs.framework_sha }}" .pro-docs-last-shas 2>/dev/null && \
               grep -q "${{ steps.remote.outputs.docs_sha }}" .pro-docs-last-shas 2>/dev/null; then
              CHANGED=false
            fi
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Upstream changed: ${CHANGED}"

  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # NOTE: Do NOT use --filter=blob:none here. build:index runs thousands of
      # `git show <tag>:<file>` calls, and with a blobless partial clone each
      # one triggers an on-demand blob fetch over the network. That lazy
      # fetching is what pushed CI builds past 1 hour while local full clones
      # take minutes. A full clone downloads once (~1-2 min on Actions
      # runners) and every later git object read is local disk I/O.
      # --no-checkout skips materializing a working tree: build:index only
      # reads the git object database (ls-tree/show/diff/log), never src/.
      - name: Clone laravel/framework (full history + tags, no working tree)
        run: |
          git clone --tags --no-checkout https://github.com/laravel/framework.git framework
          git -C framework fetch --tags --force origin

      # Fetch every docs branch tip (shallow): DocsHeaderIndexer compares
      # headings across origin/4.0..13.x, which a single-branch --depth 1
      # clone cannot see (header indexing silently became a no-op on CI).
      # The docs repo is markdown-only, so all branch tips are still tiny.
      - name: Clone laravel/docs (all branches, shallow)
        run: git clone --depth 1 --no-single-branch https://github.com/laravel/docs.git docs

      - name: Apply Overrides
        run: |
          if [ -d "overrides" ] && [ -n "$(ls -A overrides 2>/dev/null)" ]; then
            cp -r overrides/. docs/
          else
            echo "No overrides to apply."
          fi

      - name: Restore cached symbol index (incremental builds)
        id: index-cache
        uses: actions/cache/restore@v4
        with:
          path: storage/symbols_index.json
          # run_id key never hits; restore-keys falls back to the newest saved index.
          key: pro-docs-index-${{ github.run_id }}
          restore-keys: |
            pro-docs-index-

      - name: Build Framework Symbol & PR Index
        # --resume reuses the cached index and only scans tags newer than its
        # newest version (seconds for daily upstream changes instead of a full
        # ~500-tag rescan). Earliest versions are preserved, so results are
        # identical to a from-scratch build. Cache miss = full build.
        run: php bin/console build:index --framework-path=framework --docs-path=docs --resume

      - name: Rewrite Markdown Docs
        run: php bin/console docs:rewrite --docs-path=docs --output-path=output/docs

      - name: Build Static HTML Site
        run: php bin/console docs:build-static --docs-path=output/docs --output-path=dist

      - name: Save symbol index to cache
        # Cache even if later deploy steps fail: the index itself built fine
        # and the next run can resume from it.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: storage/symbols_index.json
          key: pro-docs-index-${{ github.run_id }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Only record SHAs after a successful deploy, so a failed run retries
      # the full build next time instead of being skipped as "unchanged".
      - name: Record built SHAs
        run: |
          printf '%s\n%s\n' "${{ needs.changes.outputs.framework_sha }}" "${{ needs.changes.outputs.docs_sha }}" > .pro-docs-last-shas

      - name: Save built SHAs to cache
        uses: actions/cache/save@v4
        with:
          path: .pro-docs-last-shas
          key: pro-docs-shas-${{ github.run_id }}
